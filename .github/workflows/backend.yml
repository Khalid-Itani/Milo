name: Backend verification

on:
  push:
    branches: [main, 'backend/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    name: Offline (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python scripts/verify_offline.py
      - run: git diff --exit-code -- openapi.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-${{ matrix.os }}-${{ matrix.python }}
          path: backend/verification-results/
          retention-days: 7
