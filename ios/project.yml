name: FitCoach
options:
  bundleIdPrefix: com.agxmbhir
  deploymentTarget:
    iOS: "17.0"
packages:
  VisualizeSDK:
    url: https://github.com/Visualize-KK/visualize-sdk
    from: 2.0.3
targets:
  FitCoach:
    type: application
    platform: iOS
    sources: [FitCoach]
    dependencies:
      - package: VisualizeSDK
        product: VisualizeSDK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agxmbhir.fitcoach
        DEVELOPMENT_TEAM: FFC88DM596
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: FitCoach/Info.plist
      properties:
        CFBundleDisplayName: Milo
        UIUserInterfaceStyle: Light # ponytail: light-only design; add dark tokens to Theme to support dark mode
        VZPublishableKey: pk_test_n5K2sfz6B9bNSt4860hV87hBpYc7kXvlLqZ4wlOcRsU
        NSCameraUsageDescription: Milo uses the TrueDepth camera for Visualize body scans.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
