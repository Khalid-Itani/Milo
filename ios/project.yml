name: FitCoach
options:
  bundleIdPrefix: com.hackathon
  deploymentTarget:
    iOS: "17.0"
targets:
  FitCoach:
    type: application
    platform: iOS
    sources: [FitCoach]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackathon.fitcoach
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: FitCoach/Info.plist
      properties:
        CFBundleDisplayName: FitCoach
        NSCameraUsageDescription: FitCoach uses the TrueDepth camera for Visualize body scans.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
